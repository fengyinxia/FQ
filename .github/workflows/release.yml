name: Release

# 推送 v* 标签时自动构建签名 release 包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify host callback names survive R8
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "$mapping" ]]; then
            echo "::error::Release R8 mapping is missing or empty"
            exit 1
          fi
          for callback in Function0 Function1; do
            expected="kotlin.jvm.functions.${callback} -> kotlin.jvm.functions.${callback}:"
            if ! grep -Fqx "$expected" "$mapping"; then
              echo "::error::Host callback ${callback} was renamed or removed by R8; refusing to publish"
              exit 1
            fi
            echo "Verified host callback: ${callback}"
          done

      - name: Rename APK with tag
        run: mv app/build/outputs/apk/release/app-release.apk "FuckTomato-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "FuckTomato-${{ github.ref_name }}.apk" \
            --title "FuckTomato ${{ github.ref_name }}" \
            --generate-notes
