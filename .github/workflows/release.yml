name: Release

# 推送 v* 标签时自动构建签名 release 包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff 需要完整历史与 tag 才能生成区间日志
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify host callback names survive R8
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [[ ! -s "$mapping" ]]; then
            echo "::error::Release R8 mapping is missing or empty"
            exit 1
          fi
          for callback in Function0 Function1; do
            expected="kotlin.jvm.functions.${callback} -> kotlin.jvm.functions.${callback}:"
            if ! grep -Fqx "$expected" "$mapping"; then
              echo "::error::Host callback ${callback} was renamed or removed by R8; refusing to publish"
              exit 1
            fi
            echo "Verified host callback: ${callback}"
          done

      - name: Rename APK with tag
        run: mv app/build/outputs/apk/release/app-release.apk "FuckTomato-${{ github.ref_name }}.apk"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [[ -n "$prev" ]]; then
            range="${prev}..${tag}"
            link="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
          else
            range="$(git rev-list --max-parents=0 HEAD | tail -1)..${tag}"
            link="https://github.com/${GITHUB_REPOSITORY}/commits/${tag}"
          fi
          git-cliff "$range" --tag "$tag" --strip header -o RELEASE_NOTES.body.md
          cat -s RELEASE_NOTES.body.md > RELEASE_NOTES.md
          printf '\n**Full Changelog**: %s\n' "$link" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "FuckTomato-${GITHUB_REF_NAME}.apk" \
            --title "FuckTomato ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
