plugins {
    id 'com.android.application'
}

android {
    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    namespace 'com.fuck.fanqie'
    compileSdk 33

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.fuck.fanqie"
        minSdk 23
        targetSdk 33
        versionCode 20406
        versionName "2.4.6"
        ndk {
            // 官网番茄 7.3.9.32 仅有 armeabi-v7a so，宿主进程为 32 位，
            // 只打包 arm64 会导致宿主中 DexKit 原生库无法加载。
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        // 密钥不落库：本地读根目录 keystore.properties（已 gitignore），
        // CI 通过环境变量 RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD /
        // RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD 注入。
        release {
            def storeFilePath = keystoreProperties.getProperty('storeFile') ?: System.getenv('RELEASE_STORE_FILE')
            def storePass = keystoreProperties.getProperty('storePassword') ?: System.getenv('RELEASE_STORE_PASSWORD')
            def alias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('RELEASE_KEY_ALIAS')
            def keyPass = keystoreProperties.getProperty('keyPassword') ?: System.getenv('RELEASE_KEY_PASSWORD')
            if (storeFilePath != null && storePass != null && alias != null && keyPass != null) {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
    implementation 'org.luckypray:dexkit:2.0.7'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.5.0'
}
